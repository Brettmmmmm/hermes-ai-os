name: Release Hermes AI OS

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          pip install yamllint
          yamllint config/hermes
          yamllint tools/skill-packs

      - name: Validate Skill Packs
        run: |
          for f in tools/skill-packs/*/skill.yaml; do
            echo "Validating $f"
            yq e '.' "$f" > /dev/null
          done

  package:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Package PowerShell Module
        run: |
          mkdir -p dist
          cp -r tools/modules/Hermes.Orchestration dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-orchestration
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-orchestration
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
