# =============================================================================
# Scoring Criteria
# =============================================================================
scoring_criteria:

  # Each criterion has a weight (0.0 to 1.0, must sum to 1.0).
  # For each job description, rate 0-10 on how well Brett's CV matches.

  - id: keyword-match
    label: "Keyword Match"
    description: "How many role_keywords appear in the job description?"
    weight: 0.20
    scoring_method: >
      Count intersection of role_keywords and job description text.
      Score: 0 if <3 matches, 5 if 3-5 matches, 8 if 6-8 matches, 10 if 9+ matches.

  - id: required-tech-match
    label: "Required Tech Stack Match"
    description: "How much of the required_tech_stack does Brett demonstrably have?"
    weight: 0.35
    scoring_method: >
      For each required tech: 2 if proven experience (project/cert),
      1 if adjacent knowledge, 0 if gap. Sum and normalise to 0-10.

  - id: nice-to-have-match
    label: "Nice-to-Have Match"
    description: "How many nice_to_haves can differentiate Brett?"
    weight: 0.15
    scoring_method: >
      Count nice_to_haves that Brett can credibly claim.
      0-10 scale: 0=none, 5=half, 10=all.

  - id: domain-fit
    label: "Domain & Industry Fit"
    description: "Does Brett's experience align with the company's industry?"
    weight: 0.15
    scoring_method: >
      Subjective but systematic: telecoms=10, financial services=9,
      SaaS/tech=8, public sector=6, manufacturing=5, healthcare=4, other=3.
      Adjust if Brett has specific domain experience.

  - id: salary-fit
    label: "Salary Alignment"
    description: "Is the role's salary range within Brett's target?"
    weight: 0.10
    scoring_method: >
      10 if within typical_salary_range_gbp, 8 if within 10%, 5 if within 20%,
      2 if more than 20% below min, 0 if below floor.

  - id: location-fit
    label: "Location & Remote Fit"
    description: "Is the role compatible with Brett's Northampton base?"
    weight: 0.05
    scoring_method: >
      10 if fully remote or within 45 min of Northampton,
      7 if London (commutable), 5 if 2 days/week London,
      2 if full-time on-site elsewhere in UK, 0 if relocation required.

# =============================================================================
# Quick-Reference: Which Role Gets Which Weighting
# =============================================================================
# 
# Brett's strongest match by role (pre-computed, approximate):
#
#   Infrastructure Architect:      92%  ← Natural fit. CCIE + 30yr infra.
#   Enterprise Architect:          88%  ← 10yr EA + TOGAF-capable.
#   VoIP/UCaaS Architect:          85%  ← O2 migration + VoxFlow + FreeSWITCH.
#   Cloud Platform Architect:      78%  ← Multi-cloud QoS fabric + K8s.
#   DevOps/SRE Lead:               68%  ← Built CI/CD but not primary identity.
#   AI/ML Infra Engineer:          62%  ← QoS for AI is relevant but new domain.
#
# Strategy: Lead with Infrastructure Architect and Enterprise Architect.
# VoIP/UCaaS architect when the role is voice-specific.
# Cloud Platform when the role mentions eBPF/Cilium.
