version: 1

# ============================================================
#  GLOBAL SETTINGS
# ============================================================
default_personality: architect
default_model: ollama:deepseek-v4-pro:cloud
log_level: info
telemetry: false
cache_responses: true
max_history: 20

# ============================================================
#  OLLAMA CLOUD MODELS — Canonical Registry
# ============================================================
models:
  ollama:deepseek-v4-pro:cloud:
    provider: ollama
    model: "deepseek-v4-pro:cloud"
    temperature: 0.1
    top_p: 0.9
    max_tokens: 32768

  ollama:kimi-k2.6:cloud:
    provider: ollama
    model: "kimi-k2.6:cloud"
    temperature: 0.2
    top_p: 0.9
    max_tokens: 32768

  ollama:qwen3.5:cloud:
    provider: ollama
    model: "qwen3.5:cloud"
    temperature: 0.2
    top_p: 0.9
    max_tokens: 16384

  ollama:kimi-k2.5:cloud:
    provider: ollama
    model: "kimi-k2.5:cloud"
    temperature: 0.2
    top_p: 0.9
    max_tokens: 4096

  ollama:deepseek-v3.1:671b-cloud:
    provider: ollama
    model: "deepseek-v3.1:671b-cloud"
    temperature: 0.1
    top_p: 0.9
    max_tokens: 32768

  ollama:glm-5:cloud:
    provider: ollama
    model: "glm-5:cloud"
    temperature: 0.2
    top_p: 0.9
    max_tokens: 16384

  ollama:minimax-m2.7:cloud:
    provider: ollama
    model: "minimax-m2.7:cloud"
    temperature: 0.2
    top_p: 0.9
    max_tokens: 16384

  ollama:phi3.5:latest:
    provider: ollama
    model: "phi3.5:latest"
    temperature: 0.2
    top_p: 0.9
    max_tokens: 4096

  ollama:wizardlm-uncensored:latest:
    provider: ollama
    model: "wizardlm-uncensored:latest"
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096

  ollama:nomic-embed-text:latest:
    provider: ollama
    model: "nomic-embed-text:latest"
    temperature: 0.0
    max_tokens: 512

  openai:gpt-4.1-mini:
    provider: openai
    model: "gpt-4.1-mini"
    temperature: 0.3
    max_tokens: 4096

# ============================================================
#  SKILL ROUTING — Skill → Model mapping (deterministic)
# ============================================================
routing:
  # Core operational skills
  diagnostics: ollama:kimi-k2.6:cloud
  remediation: ollama:kimi-k2.6:cloud
  codegen: ollama:deepseek-v3.1:671b-cloud
  planning: ollama:deepseek-v4-pro:cloud
  summarisation: ollama:qwen3.5:cloud

  # Domain skills — Enterprise Architecture
  enterprise-architecture: ollama:deepseek-v4-pro:cloud

  # Domain skills — VoxFlow Operations
  voxflow-operations: ollama:kimi-k2.6:cloud

  # Domain skills — Income Generation
  income-generation: ollama:kimi-k2.6:cloud

  # Domain skills — Hermes Mesh
  hermes-mesh: ollama:deepseek-v4-pro:cloud

# ============================================================
#  INCLUDE PATHS
# ============================================================
include:
  personalities_dir: "./personalities"
  skills_dir: "./skills"
  profiles_dir: "../profiles"
